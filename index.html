<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Rider Waite - Arcanos Mayores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .header p {
            color: #a8a8a8;
            font-size: 1.1em;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .stat-label {
            font-size: 0.9em;
            color: #a8a8a8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00d4ff;
        }

        .game-area {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 40px;
            backdrop-filter: blur(20px);
        }

        .card-container {
            perspective: 1000px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
        }

        .card {
            width: 220px;
            height: 320px;
            background: linear-gradient(135deg, #2d5a7b 0%, #1a3a52 100%);
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.5) rotateY(90deg); opacity: 0; }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,100,200,0.3);
        }

        .card.number-mode {
            background: linear-gradient(135deg, #5a2d7b 0%, #3a1a52 100%);
        }

        .card.image-mode {
            padding: 10px;
            background: linear-gradient(135deg, #2d5a7b 0%, #1a3a52 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-number {
            font-size: 4em;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0,212,255,0.5);
        }

        .card img {
            max-width: 90%;
            max-height: 90%;
            height: auto;
            width: auto;
            object-fit: contain;
            border-radius: 6px;
        }

        .question {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.2em;
            color: #e0e0e0;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .option {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.05em;
            text-align: center;
            font-weight: 500;
        }

        .option:hover {
            background: rgba(0,212,255,0.15);
            border-color: rgba(0,212,255,0.5);
            transform: translateY(-2px);
        }

        .option.correct {
            background: rgba(76,175,80,0.3);
            border-color: rgba(76,175,80,0.8);
            color: #4caf50;
            animation: correctAnswer 0.5s ease;
        }

        @keyframes correctAnswer {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .option.incorrect {
            background: rgba(244,67,54,0.3);
            border-color: rgba(244,67,54,0.8);
            color: #f44336;
        }

        .option:disabled {
            cursor: not-allowed;
        }

        .feedback {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: bold;
            min-height: 30px;
        }

        .feedback.correct {
            color: #4caf50;
            animation: fadeIn 0.5s ease;
        }

        .feedback.incorrect {
            color: #f44336;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .next-button {
            background: linear-gradient(135deg, #00d4ff 0%, #0088cc 100%);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }

        .next-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,212,255,0.4);
        }

        .next-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff 0%, #0088cc 100%);
            transition: width 0.3s ease;
        }

        .game-over {
            text-align: center;
            padding: 40px;
        }

        .game-over h2 {
            font-size: 2.2em;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .final-score {
            font-size: 3em;
            font-weight: bold;
            margin: 30px 0;
            color: #4caf50;
        }

        .restart-button {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .restart-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(76,175,80,0.4);
        }

        .card-name-hint {
            color: #a8a8a8;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .game-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
            align-items: flex-start;
        }

        .game-layout .card-container {
            flex-shrink: 0;
            margin-bottom: 0;
        }

        .game-right {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 600px) {
            .game-layout {
                flex-direction: column;
                align-items: center;
            }

            .game-right {
                width: 100%;
                align-items: center;
            }

            .options {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .card {
                width: 180px;
                height: 260px;
            }

            .card-number {
                font-size: 3em;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .game-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🃏 Arcanos Mayores</h1>
            <p>Aprende las 22 cartas del Tarot Rider Waite</p>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Correctas</div>
                <div class="stat-value" id="correct">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Incorrectas</div>
                <div class="stat-value" id="incorrect">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Precisión</div>
                <div class="stat-value" id="accuracy">0%</div>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div id="gameContent">
                <div class="question" id="question"></div>

                <div class="game-layout">

                    <div class="card-container">
                        <div class="card" id="card"></div>
                    </div>

                    <div class="game-right">
                        <div class="options" id="options"></div>
                        <div class="feedback" id="feedback"></div>
                        <button class="next-button" id="nextButton" disabled>Siguiente</button>
                    </div>
                </div>
            </div>

            <div id="gameOverContent" style="display:none;" class="game-over">
                <h2>¡Juego Terminado!</h2>
                <p>Has completado una ronda de estudio</p>
                <div class="final-score" id="finalScore"></div>
                <button class="restart-button" onclick="location.reload()">Jugar de Nuevo</button>
            </div>
        </div>
    </div>

    <script>
        const arcanos = [
            { num: 0, nombre: "El Loco", nombreEn: "The Fool" },
            { num: 1, nombre: "El Mago", nombreEn: "The Magician" },
            { num: 2, nombre: "La Sacerdotisa", nombreEn: "The High Priestess" },
            { num: 3, nombre: "La Emperatriz", nombreEn: "The Empress" },
            { num: 4, nombre: "El Emperador", nombreEn: "The Emperor" },
            { num: 5, nombre: "El Hierofante", nombreEn: "The Hierophant" },
            { num: 6, nombre: "Los Enamorados", nombreEn: "The Lovers" },
            { num: 7, nombre: "El Carro", nombreEn: "The Chariot" },
            { num: 8, nombre: "La Fuerza", nombreEn: "Strength" },
            { num: 9, nombre: "El Ermitaño", nombreEn: "The Hermit" },
            { num: 10, nombre: "La Rueda de la Fortuna", nombreEn: "Wheel of Fortune" },
            { num: 11, nombre: "La Justicia", nombreEn: "Justice" },
            { num: 12, nombre: "El Colgado", nombreEn: "The Hanged Man" },
            { num: 13, nombre: "La Muerte", nombreEn: "Death" },
            { num: 14, nombre: "La Templanza", nombreEn: "Temperance" },
            { num: 15, nombre: "El Diablo", nombreEn: "The Devil" },
            { num: 16, nombre: "La Torre", nombreEn: "The Tower" },
            { num: 17, nombre: "La Estrella", nombreEn: "The Star" },
            { num: 18, nombre: "La Luna", nombreEn: "The Moon" },
            { num: 19, nombre: "El Sol", nombreEn: "The Sun" },
            { num: 20, nombre: "El Juicio", nombreEn: "Judgement" },
            { num: 21, nombre: "El Mundo", nombreEn: "The World" }
        ];

        // URLs de imágenes del Tarot Rider Waite desde Wikimedia Commons
        const cartasImagenes = {
            0: "https://upload.wikimedia.org/wikipedia/commons/9/9b/RWS_Tarot_00_Fool.jpg",
            1: "https://upload.wikimedia.org/wikipedia/commons/d/de/RWS_Tarot_01_Magician.jpg",
            2: "https://upload.wikimedia.org/wikipedia/commons/8/8d/RWS_Tarot_02_High_Priestess.jpg",
            3: "https://upload.wikimedia.org/wikipedia/commons/d/d2/RWS_Tarot_03_Empress.jpg",
            4: "https://upload.wikimedia.org/wikipedia/commons/c/c3/RWS_Tarot_04_Emperor.jpg",
            5: "https://upload.wikimedia.org/wikipedia/commons/8/8d/RWS_Tarot_05_Hierophant.jpg",
            6: "https://upload.wikimedia.org/wikipedia/commons/f/f8/RWS_Tarot_06_Lovers.jpg",
            7: "https://upload.wikimedia.org/wikipedia/commons/9/9b/RWS_Tarot_07_Chariot.jpg",
            8: "https://upload.wikimedia.org/wikipedia/commons/f/f5/RWS_Tarot_08_Strength.jpg",
            9: "https://upload.wikimedia.org/wikipedia/commons/4/4d/RWS_Tarot_09_Hermit.jpg",
            10: "https://upload.wikimedia.org/wikipedia/commons/3/3c/RWS_Tarot_10_Wheel_of_Fortune.jpg",
            11: "https://upload.wikimedia.org/wikipedia/commons/e/e0/RWS_Tarot_11_Justice.jpg",
            12: "https://upload.wikimedia.org/wikipedia/commons/d/d6/RWS_Tarot_12_Hanged_Man.jpg",
            13: "https://upload.wikimedia.org/wikipedia/commons/d/d7/RWS_Tarot_13_Death.jpg",
            14: "https://upload.wikimedia.org/wikipedia/commons/f/f8/RWS_Tarot_14_Temperance.jpg",
            15: "https://upload.wikimedia.org/wikipedia/commons/5/55/RWS_Tarot_15_Devil.jpg",
            16: "https://upload.wikimedia.org/wikipedia/commons/5/53/RWS_Tarot_16_Tower.jpg",
            17: "https://upload.wikimedia.org/wikipedia/commons/e/e4/RWS_Tarot_17_Star.jpg",
            18: "https://upload.wikimedia.org/wikipedia/commons/7/7f/RWS_Tarot_18_Moon.jpg",
            19: "https://upload.wikimedia.org/wikipedia/commons/1/17/RWS_Tarot_19_Sun.jpg",
            20: "https://upload.wikimedia.org/wikipedia/commons/f/f7/RWS_Tarot_20_Judgement.jpg",
            21: "https://upload.wikimedia.org/wikipedia/commons/f/ff/RWS_Tarot_21_World.jpg"
        };

        let correctCount = 0;
        let incorrectCount = 0;
        let currentQuestion = null;
        let answered = false;
        let questionCount = 0;
        const totalQuestions = 22;

        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function getWrongAnswers(correctAnswer, count = 3) {
            let wrong = [];
            const pool = arcanos.filter(a => a !== correctAnswer);
            while (wrong.length < count) {
                wrong.push(getRandomItem(pool));
            }
            return wrong;
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function generateQuestion() {
            if (questionCount >= totalQuestions) {
                endGame();
                return;
            }

            answered = false;
            const isNumberMode = Math.random() < 0.5;
            const arcano = getRandomItem(arcanos);

            if (isNumberMode) {
                // Mostrar número, adivinar nombre
                currentQuestion = {
                    type: 'number',
                    arcano: arcano,
                    correct: arcano.nombre,
                    options: shuffleArray([
                        arcano.nombre,
                        ...getWrongAnswers(arcano, 3).map(a => a.nombre)
                    ])
                };
                document.getElementById('question').textContent = `¿Cuál es el nombre del arcano Nº ${arcano.num}?`;
                document.getElementById('card').className = 'card number-mode';
                document.getElementById('card').innerHTML = `<div class="card-number">${arcano.num}</div>`;
            } else {
                // Mostrar imagen, adivinar número
                currentQuestion = {
                    type: 'image',
                    arcano: arcano,
                    correct: arcano.num,
                    options: shuffleArray([
                        arcano.num,
                        ...getWrongAnswers(arcano, 3).map(a => a.num)
                    ])
                };
                document.getElementById('question').textContent = `¿Cuál es el número de este arcano?`;
                const cardElement = document.getElementById('card');
                cardElement.className = 'card image-mode';
                cardElement.innerHTML = `<img src="${cartasImagenes[arcano.num]}" alt="${arcano.nombre}" />`;
            }

            renderOptions();
            updateProgress();
        }

        function renderOptions() {
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'option';
                button.textContent = option;
                button.onclick = () => checkAnswer(option);
                button.disabled = answered;
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selected) {
            if (answered) return;
            answered = true;
            questionCount++;

            const isCorrect = selected === currentQuestion.correct;
            
            if (isCorrect) {
                correctCount++;
                document.getElementById('feedback').className = 'feedback correct';
                document.getElementById('feedback').textContent = '¡Correcto! 🎉';
            } else {
                incorrectCount++;
                document.getElementById('feedback').className = 'feedback incorrect';
                document.getElementById('feedback').textContent = `Incorrecto. La respuesta es: ${currentQuestion.correct}`;
            }

            // Marcar opciones
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                option.disabled = true;
                if (option.textContent === currentQuestion.correct.toString()) {
                    option.classList.add('correct');
                } else if (option.textContent === selected.toString()) {
                    option.classList.add('incorrect');
                }
            });

            document.getElementById('nextButton').disabled = false;
            updateStats();
        }

        function updateStats() {
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('incorrect').textContent = incorrectCount;
            const total = correctCount + incorrectCount;
            const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function updateProgress() {
            const progress = (questionCount / totalQuestions) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function endGame() {
            document.getElementById('gameContent').style.display = 'none';
            document.getElementById('gameOverContent').style.display = 'block';
            
            const accuracy = Math.round((correctCount / totalQuestions) * 100);
            document.getElementById('finalScore').textContent = `${correctCount}/22 (${accuracy}%)`;
        }

        document.getElementById('nextButton').addEventListener('click', () => {
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextButton').disabled = true;
            generateQuestion();
        });

        // Iniciar el juego
        generateQuestion();
    </script>
</body>
</html>
